name: Publish Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cd-web.yml
      - deploy/web/**
      - web/**
      - packages/crawler/**
      - packages/translator/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-web
  cancel-in-progress: true

env:
  IMAGE_OWNER: auto-novel
  IMAGE_NAME: auto-novel-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Resolve build metadata
        id: build_metadata
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          file: deploy/web/Dockerfile
          push: true
          provenance: false
          build-args: |
            VITE_GIT_COMMIT=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.build_metadata.outputs.build_time }}
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 1
