name: CD API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cd-api.yml
      - .github/workflows/ci-api.yml
      - .dockerignore
      - deploy/api/**
      - apps/api/**

permissions:
  contents: read

concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_OWNER: auto-novel
  IMAGE_NAME: auto-novel-api

jobs:
  check:
    uses: ./.github/workflows/ci-api.yml

  build-and-push:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          file: deploy/api/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ env.IMAGE_OWNER }}
          package: ${{ env.IMAGE_NAME }}
          exclude-tags: latest
          keep-n-tagged: 1
          delete-untagged: true
