name: Publish Server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        .github/workflows/cd-server.yml,
        server/**,
        deploy/server/**,
        .dockerignore,
      ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-server
  cancel-in-progress: true

env:
  IMAGE_OWNER: auto-novel
  IMAGE_NAME: auto-novel-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          file: deploy/server/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: ${{ env.IMAGE_OWNER }}
          package: ${{ env.IMAGE_NAME }}
          exclude-tags: latest
          keep-n-tagged: 1
          delete-untagged: true
